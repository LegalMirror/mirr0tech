# Publishes the static dashboard (exported policies + the Sepolia record) to GitHub Pages on every push to main.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run vendor
      - run: npm --prefix dashboard ci
      - run: npm --prefix dashboard run build
        env:
          NEXT_PUBLIC_BASE_PATH: /mirr0tech
          NEXT_PUBLIC_GATEWAY_URL: https://mir-api.peeramid.xyz
      - uses: actions/upload-pages-artifact@v3
        with: { path: dashboard/out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
