# Local override: publishes host ports so the stack can be tried without Coolify.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml up --build
services:
  anvil:
    ports: ["127.0.0.1:8545:8545"]
  api:
    environment:
      NODE_ENV: development
      EXPECTED_CHAIN_ID: "31337"
    ports: ["127.0.0.1:3200:3200"]
  dashboard:
    ports: ["127.0.0.1:3100:3100"]
