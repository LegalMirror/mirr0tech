# Local/demo base: combine with docker-compose.local.yml (including its development mode).
# For remote Coolify deployments use docker-compose.remote.yml, not this permissive demo stack.
# The chain is a throwaway Anvil; a restart can invalidate persisted agreement deployments.
name: mirr0tech

networks:
  mirr0tech:
    name: mirr0tech
    driver: bridge

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337", "--block-time", "1", "--silent"]
    networks: [mirr0tech]
    expose: ["8545"]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    networks: [mirr0tech]
    expose: ["3200"]
    restart: unless-stopped
    depends_on: [anvil]
    volumes: [api-data:/app/.data]
    environment:
      PORT: "3200"
      HOST: 0.0.0.0
      RPC_URL: ${RPC_URL:-http://anvil:8545}
      API_KEY: ${API_KEY:-local-dev-stack-operator-key-only}
      VIEWER_KEY: ${VIEWER_KEY:-}
      SEED: ${SEED:-true}
      DEPLOYER_PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY:-}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      DEPLOYMENT_PATH: ${DEPLOYMENT_PATH:-}
      AUDIT_PATH: ${AUDIT_PATH:-}
      DATA_DIR: /app/.data
      WORLD_APP_ID: ${WORLD_APP_ID:-}
      WORLD_RP_ID: ${WORLD_RP_ID:-}
      WORLD_RP_SIGNING_KEY: ${WORLD_RP_SIGNING_KEY:-}
      WORLD_ENVIRONMENT: sandbox
      WORLD_LOGIN_MODE: ${WORLD_LOGIN_MODE:-mock}
      WORLD_LOGIN_ACTION: ${WORLD_LOGIN_ACTION:-}
      WORLD_SESSION_DB: /app/.data/world-sessions.sqlite
      BORROWER_ADDRESS: ${BORROWER_ADDRESS:-}
      AQUA: ${AQUA:-}
      POOL_MANAGER: ${POOL_MANAGER:-}
      WETH: ${WETH:-}

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL}

    networks: [mirr0tech]
    expose: ["3100"]
    restart: unless-stopped
    environment:
      PORT: "3100"

volumes:
  api-data:
